[project]
name = "zeroband"
version = "0.1.0"
description = "ZeroBand is a production ready codebase for decentralized training of LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.6.0; extra!='rocm'",
    "numpy",
    "setuptools",
    "transformers>=4.44.2",
    "datasets>=3.0.0",
    "pydantic_config[toml] @ git+https://github.com/samsja/pydantic_config.git@b7becc3",
    "torchdata>=0.8.0",
    "fsspec[gcs]>=2024.3.1",
    "ninja",
    "zstandard",
    "pyarrow",
    "toposolve>=0.1.17",
    "psutil",
    "torch-shampoo @ git+https://github.com/facebookresearch/optimizers.git@main",
    "liger-kernel-nightly>=0.5.2.dev20250122195349",
]

[project.optional-dependencies]

all = ["wandb","lm-eval"]
cuda=[ "torch==2.6.0"]
rocm = [ "torch==2.6.0;extra=='rocm'",
  "pytorch-triton-rocm==3.2.0; sys_platform == 'linux' and extra=='rocm'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true # allow direct references to git repos in dependencies

[tool.ruff]
line-length = 120

[tool.uv]
dev-dependencies = ["ruff>=0.5.0", "pre-commit>=3.0.0","pytest>=7.0.0", "faker"]
conflicts = [
  [
    { extra = "cuda" },
    { extra = "rocm" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-rocm" ,extra="rocm" },
  {index = "pytorch-cuda",extra="cuda"}
]

pytorch-triton-rocm = [
  { index = "pytorch-rocm" ,extra="rocm"},
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2.4"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true